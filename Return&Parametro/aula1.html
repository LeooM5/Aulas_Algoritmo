<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <input type="text" id="ipt_frase" placeholder="Insira uma frase aqui" />
    <button onclick="exibir()">Cumprimentar</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function cumprimentar() {
    let texto = ipt_frase.value;

    return `Frase: ${texto}`;
  }

  function exibir() {
    msg.innerHTML = cumprimentar();
  }
</script>
