<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    Me informe sua idade:
    <input type="number" id="ipt_idade" />
    <select id="ipt_pagamento">
      <option value="Dinheiro">Dinheiro</option>
      <option value="Débito">Débito</option>
      <option value="Cheque">Cheque</option>
    </select>
    <button onclick="analisar()">Analisar</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let idade = Number(ipt_idade.value);
    let pagamento = ipt_pagamento.value;

    if (idade >= 18 && (pagamento == "Dinheiro" || pagamento == "Débito")) {
        msg.innerHTML = `Pode pagar`
    } else {
        msg.innerHTML = `Não pode pagar`
    }
  }
</script>
