<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Meta de Economia: Você Está no Caminho Certo?</h1>
    Me informe sua meta de economia:
    <input type="number" id="ipt_meta" />
    Me informe quanto tem guardado:
    <input type="number" id="ipt_temGuardado" />
    <button onclick="analisar()">Analisar economia</button>
    <div id="mensagem"></div>
  </body>
</html>

<script>
  function analisar() {
    let queroAtingir = Number(ipt_meta.value);
    let tenhoAtualmente = Number(ipt_temGuardado.value);
    let diferenca = tenhoAtualmente - queroAtingir;
    let passei = queroAtingir - tenhoAtualmente;

    if (diferenca < 0) {
      mensagem.innerHTML = `Meta ultrapassada em ${passei}`;
    } else if (diferenca == 0) {
      mensagem.innerHTML = `Parabéns, meta alcançada!`;
    } else {
      mensagem.innerHTML = `Força! Ainda em busca da meta! Falta ${diferenca}`;
    }
  }
</script>
