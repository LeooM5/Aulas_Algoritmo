<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Desempenho Escolar: Como Está Sua Nota?</h1>
    Informe a sua nota:
    <input type="number" id="ipt_nota" />
    <button onclick="analisar()">Avaliar aluno</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let nota = Number(ipt_nota.value);

    if (nota < 6) {
      alert(`Aluno não aprovado`);
    } else if (nota >= 8.5 && nota <= 10) {
      alert(`Aluno Exemplar!`);
    } else {
      alert(`Aluno comum e aprovado`);
    }
  }
</script>
