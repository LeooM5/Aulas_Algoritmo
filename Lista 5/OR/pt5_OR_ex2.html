<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Processo Seletivo Mentes Brilhantes</h1>
    Informe a sua nota do ENEM:
    <input type="number" id="ipt_enem" />
    Informe a sua nota do vestibular interno:
    <input type="number" id="ipt_vestibular" />
    <button onclick="analisar()">Avaliação</button>
  </body>
</html>

<script>
  function analisar() {
    let enem = Number(ipt_enem.value);
    let vestibular = Number(ipt_vestibular.value);

    if (enem >= 800 || vestibular >= 700) {
      alert(`Parabéns! Aprovado`);
    } else {
      alert(`Tente semestre que vem!`);
    }
  }
</script>
