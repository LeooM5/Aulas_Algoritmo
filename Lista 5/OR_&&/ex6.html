<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Desempenho Escolar: O Aluno Foi Aprovado?</h1>
    Informe a sua nota:
    <input type="text" id="ipt_nota" />
    Informe a sua frequencia:
    <input type="text" id="ipt_frequencia" />

    <button onclick="avaliar()">Analisar aluno</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function avaliar() {
    let nota = Number(ipt_nota.value);
    let frequencia = Number(ipt_frequencia.value);

    if (nota < 0 || nota > 10) {
      msg.innerHTML = ``;
      alert(`Onde já se viu nota <0 ou >10?`);
    } else if (frequencia < 0 || frequencia > 100) {
      msg.innerHTML = ``;
      alert(`Onde já se viu frequência <0 ou >100?!`);
    } else {
      if (nota < 6) {
        msg.innerHTML = `Aluno ficou abaixo da média<br>`;
      } else if (nota <= 8) {
        msg.innerHTML = `Aluno ficou na média<br>`;
      } else if (nota <= 10) {
        msg.innerHTML = `Aluno acima da média<br>`;
      }

      if (frequencia >= 75) {
        msg.innerHTML += `Aluno aprovado por frequência`;
      } else {
        msg.innerHTML += `Aluno reprovado por frequência`;
      }
    }
  }
</script>
