<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Autenticação Segura: Acesso ao Banco Melete</h1>
    Informe o seu login:
    <input type="text" id="ipt_login" />
    Informe a sua senha:
    <input type="text" id="ipt_senha" />
    Informe a sua informação pessoal:
    <input type="text" id="ipt_infoPessoal" />

    <button onclick="avaliar()">Autenticar</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function avaliar() {
    let login = ipt_login.value;
    let senha = ipt_senha.value;
    let infoPessoal = ipt_infoPessoal.value;

    if (
      login == "ana" &&
      senha == "braga" &&
      (infoPessoal == "1949" || infoPessoal == "louro josé")
    ) {
      msg.innerHTML = `Usuário autenticado`;
    } else {
      msg.innerHTML = `Falha na autenticação`;
    }
  }
</script>
