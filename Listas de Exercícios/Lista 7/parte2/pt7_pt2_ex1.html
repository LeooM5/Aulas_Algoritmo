<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>É tri/penta!</h1>

    Me informe um intervalo crescente
    <br />
    Mínimo:
    <input type="number" id="ipt_minimo" />
    Máximo:
    <input type="number" id="ipt_maximo" />

    <button onclick="verificar()">Curto 3 e 5!</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function verificar() {
    let minimo = Number(ipt_minimo.value);
    let maximo = Number(ipt_maximo.value);
    let contador = minimo;
    let mensagem = ``;

    if (minimo < maximo) {
      while (contador <= maximo) {
        if (contador % 5 == 0 && contador % 3 == 0) {
          mensagem += `É TRI!É PENTA!<br>`;
        } else if (contador % 5 == 0) {
          mensagem += `É PENTA!<br>`;
        } else if (contador % 3 == 0) {
          mensagem += `É TRI!<br>`;
        } else {
          mensagem += `${contador}<br>`;
        }
        contador++;
      }
    } else {
      alert("Insira um intervalo válido!");
    }

    msg.innerHTML = mensagem;
  }
</script>
