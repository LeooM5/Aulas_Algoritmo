<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Divisibilidade</h1>

    Informe um número entre 10 e 500:
    <input type="number" id="ipt_num" />

    <button onclick="verificar()">Somar Pares</button>
    <br /><br />
    <div id="msg"></div>
  </body>
</html>

<script>
  function verificar() {
    let num = Number(ipt_num.value);
    let contador = 0;
    let mensagem = ``;
    let soma = 0;

    if (num < 10 || num > 500) {
      alert(`Insira um número válido!`);
    } else {
      while (contador < num) {
        contador++;
        if (contador % 2 == 0) {
          soma += contador;
          mensagem += `${contador}<br>`;
        }
      }

      msg.innerHTML = `${mensagem}<br>Soma dos pares: ${soma}`;
    }
  }
</script>
