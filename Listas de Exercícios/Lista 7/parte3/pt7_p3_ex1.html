<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Divisibilidade</h1>

    Me informe um intervalo crescente
    <br />
    Mínimo:
    <input type="number" id="ipt_minimo" />
    Máximo:
    <input type="number" id="ipt_maximo" />
    Número para teste de Divisibilidade
    <input type="number" id="num_teste" />

    <button onclick="verificar()">Divisível</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function verificar() {
    let minimo = Number(ipt_minimo.value);
    let maximo = Number(ipt_maximo.value);
    let numTeste = Number(num_teste.value);
    let contador = minimo;
    let mensagem = ``;

    if (minimo >= 1 && maximo <= 13 && minimo < maximo) {
        mensagem = `Não são divisíveis por ${numTeste} no intervalo determinado:<br>`;
      while (contador <= maximo) {
        if (!(contador % numTeste == 0)) {
          mensagem += `${contador}<br>`;
        }
        contador++;
      }
    } else {
      alert("Insira um intervalo entre 1 e 13!");
    }

    msg.innerHTML = mensagem;
  }
</script>
