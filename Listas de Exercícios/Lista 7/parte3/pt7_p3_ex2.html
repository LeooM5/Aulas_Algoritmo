<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Divisores</h1>

    Me informe um número de 0 a 100
    <input type="number" id="ipt_num" />
    <button onclick="verificar()">Divisível</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function verificar() {
    let num = Number(ipt_num.value);
    let contador = 0;
    let mensagem = ``;

    if (num >= 0 && num <= 100) {
      while (contador <= num) {
        if (num % contador == 0) {
          mensagem += `${contador}<br>`;
        }
        contador++;
      }
    } else {
      alert("Insira um intervalo entre 0 e 100!");
    }

    msg.innerHTML = mensagem;
  }
</script>
