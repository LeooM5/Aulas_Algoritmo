<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>S2 Pares</h1>

    <button onclick="filtrar()">S2 Pares</button>
    <br /><br />
    <div id="msg"></div>
  </body>
</html>

<script>
  function filtrar() {
    let cont = 0;
    let frases = ``;

    while (cont <= 100) {
      if (cont % 2 == 0) {
        frases += `${cont}<br>`;
      }
      cont++;
    }

    msg.innerHTML = frases;
  }
</script>
