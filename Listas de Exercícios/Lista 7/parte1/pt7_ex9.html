<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Viva o 7!</h1>

    Me informe um número (tem que ser entre 0 e 200)
    <input type="number" id="ipt_num" />
    <button onclick="filtrar()">S2 Pares</button>
    <br /><br />
    <div id="msg"></div>
  </body>
</html>

<script>
  function filtrar() {
    let cont = 0;
    let num = Number(ipt_num.value);
    let frases = ``;

    if (num >= 0 && num <= 200) {
      while (cont <= num) {
        if (cont % 7 == 0) {
          frases += `${cont}<br>`;
        }
        cont++;
      }
    } else {
      alert(`Insira um número válido`);
    }

    msg.innerHTML = frases;
  }
</script>
