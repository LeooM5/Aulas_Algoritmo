<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Papagaio Repetitivo</h1>

    Me informe um número:
    <input type="number" id="ipt_num" />
    Me informe uma frase:
    <input type="text" id="ipt_frase" />

    <button onclick="filtrar()">Papagaio Repetitivo</button>
    <br /><br />
    <div id="msg"></div>
  </body>
</html>

<script>
  function filtrar() {
    let cont = 0;
    let num = Number(ipt_num.value);
    let frase = ipt_frase.value;
    let frases = ``;

    while (cont < num) {
      cont++;
      frases += `${cont} - ${frase}<br>`;
    }

    msg.innerHTML = frases;
  }
</script>
