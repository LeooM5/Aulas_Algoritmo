<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Expressar amor</h1>

    Me informe o nome da pessoa que você mais ama na vida
    <input type="text" id="ipt_nome" />

    Me informe o quanto você a ama (um número inteiro)
    <input type="number" id="ipt_num" />

    <button onclick="expressar()">
      Expressar
    </button>
    <br /><br />
    <div id="msg"></div>
  </body>
</html>

<script>
  function expressar() {
    let contador = 0;
    let nome = ipt_nome.value;
    let num = Number(ipt_num.value);
    let frases = ``

    while (contador < num) {
      contador++;
      frases += `${contador} - ${nome}, eu te amo! Sempre lembre disso!<br>`;
    }

    msg.innerHTML = frases;
  }
</script>
