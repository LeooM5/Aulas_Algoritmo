<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Frase Numerada</h1>

    <button onclick="aleatorio()">
      Diga algo sobre a matéria de Algoritmos
    </button>
    <br /><br />
    <div id="msg"></div>
  </body>
</html>

<script>
  function aleatorio() {
    let contador = 0;
    let frases = ``;

    while (contador < 7) {
      contador++;
      frases += `${contador}. Professor explica muito bem<br>`;
    }

    msg.innerHTML = frases;
  }
</script>
