<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <h1>Papagaio Falante</h1>

    Me informe um número:
    <input type="number" id="ipt_num" />
    Me informe uma frase:
    <input type="text" id="ipt_frase" />

    <button onclick="filtrar()">Papagaio</button>
  </body>
</html>

<script>
  function filtrar() {
    let cont = 0;
    let contFrase = 1;
    let num = Number(ipt_num.value);
    let frase = String(ipt_frase.value);
    let fraseRepetir = frase

    while (contFrase < num) {
      frase += ` ${fraseRepetir}`;
      contFrase++;
    }

    while (cont < num) {
      cont++;
      alert(`${frase}`);
    }
  }
</script>
