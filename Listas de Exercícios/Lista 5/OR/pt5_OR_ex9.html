<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Analisador de Compra: Escolhendo a Melhor TV Dentro do Orçamento</h1>
    Informe a marca da TV (dentre as opções "Samsung", "LG", "Mondial" e
    "Britânia"):
    <input type="text" id="ipt_marca" />
    Informe o preço da TV:
    <input type="number" id="ipt_valor" />
    <button onclick="analisar()">Analisar compra</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let marca = ipt_marca.value;
    let valor = Number(ipt_valor.value);

    if (valor < 800 || valor > 2000) {
      msg.innerHTML = `TV fora da faixa de preço<br>`
      if (valor < 800) {
        msg.innerHTML += `Preço baixo demais!`
      } else {
        msg.innerHTML += `TV cara demais, infelizmente`
      }
    } else if(marca == 'Mondial' || marca == 'Britânia') {
      msg.innerHTML = `Na faixa de preço, porém marca não confiável`
    } else {
    msg.innerHTML = `Essa TV pode entrar na sua lista!`
    }
  }
</script>
