<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Validação de Notas: Seu Resultado é Aceitável?</h1>
    Informe a sua nota:
    <input type="number" id="ipt_nota" />
    <button onclick="analisar()">Avaliar aluno</button>
  </body>
</html>

<script>
  function analisar() {
    let nota = Number(ipt_nota.value);

    if (nota >= 0 && nota <= 10) {
      alert(`Nota válida!`);
    } else {
      alert(`Onde já se viu nota menor que 0 e maior que 10?!`);
    }
  }
</script>
