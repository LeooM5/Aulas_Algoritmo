<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Auxílio Covid-19: Você Tem Direito ao Benefício?</h1>
    Informe a sua renda:
    <input type="number" id="ipt_renda" />
    Informe a renda total familiar:
    <input type="number" id="ipt_rendaFamiliar" />
    <button onclick="analisar()">Verificar ajuda</button>
  </body>
</html>

<script>
  function analisar() {
    let renda = Number(ipt_renda.value);
    let rendaFamiliar = Number(ipt_rendaFamiliar.value);

    if (renda <= 1050 && rendaFamiliar <= 2100) {
      alert(`Você terá direito!`);
    } else {
      alert(`Você NÃO terá direito!`);
    }
  }
</script>
