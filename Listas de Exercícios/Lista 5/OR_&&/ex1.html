<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Sistema de Avaliação de Atendimento: Dê Sua Nota!</h1>
    Informe a nota para o atendimento:
    <input type="number" id="ipt_nota" />
    <button onclick="avaliar()">Avaliar atendimento</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function avaliar() {
    let nota = Number(ipt_nota.value);

    if (nota < 0 || nota > 10) {
      msg.innerHTML = `Nota inválida`;
    } else if (nota < 5) {
      msg.innerHTML = `Não aprovado`;
    } else if (nota <= 6) {
      msg.innerHTML = `Neutro`;
    } else {
      msg.innerHTML = `Aprovado`;
    }
  }
</script>
