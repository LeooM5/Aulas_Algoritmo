<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <h1>Filmes em Cores: Azul e Vermelho Alternados</h1>

    <input type="text" id="ipt_filme" />
    <button onclick="cadastrar()">Cadastar</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  let filmes = [];
  let contador = 1;

  function cadastrar() {
    let filme = ipt_filme.value;
    filmes.push(filme);
    let cor = ``;

    if (contador % 2 == 0) {
      cor = "red";
    } else {
      cor = "blue";
    }

    msg.innerHTML += `<br><span style="color: ${cor};">${filmes[contador - 1]}</span><br>`;

    contador++;
  }
</script>
