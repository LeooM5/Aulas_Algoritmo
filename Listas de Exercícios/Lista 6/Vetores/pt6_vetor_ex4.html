<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <h1>Top Filmes Favoritos: Do Mais Amado ao Menos</h1>

    Me informe os seus filmes na ordem do mais favorito para o Menos
    <input type="text" id="ipt_filme" />
    <button onclick="cadastrar()">Cadastrar filme</button>
    <button onclick="ver()">Ver Favoritos</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  let filmes = [];

  function cadastrar() {
    let filme = ipt_filme.value;
    filmes.push(filme);
  }

  function ver() {
    mensagem = filmes.toString().replaceAll(",", "<br>");
    mensagem += `<br><br>Total: ${filmes.length}`;
    mensagem += `
    <br>O filme que mais gosta é ${filmes[0]}.
    <br>E desses, o que menos gosta é ${filmes[filmes.length - 1]} 
 `;

    msg.innerHTML = mensagem;
  }
</script>
