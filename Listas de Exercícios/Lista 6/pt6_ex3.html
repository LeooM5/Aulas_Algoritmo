<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Primeira e Última letra</h1>

    Me informe uma frase
    <input type="text" id="ipt_frase" />
    Me informe uma palavra
    <input type="text" id="ipt_palavra" />

    <button onclick="analisar()">Analisar Frase</button>

    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let frase = ipt_frase.value;
    let palavra = ipt_palavra.value;

    if (frase.startsWith(palavra) && frase.endsWith(palavra)) {
      msg.innerHTML = `A frase começa e termina com ${palavra}!`;
    } else if (frase.startsWith(palavra)) {
      msg.innerHTML = `A frase começa com ${palavra}!!`;
    } else if (frase.endsWith(palavra)) {
      msg.innerHTML = `A frase termina com ${palavra}!`;
    } else {
      msg.innerHTML = `A frase não começa e nem termina com ${palavra}!`;
    }
  }
</script>
