<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Comparador de Palavras</h1>

    Me informe uma palavra
    <input type="text" id="ipt_palavra1" />
    Me informe outra palavra
    <input type="text" id="ipt_palavra2" />

    <button onclick="analisar()">Analisar Palavras</button>

    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let palavra1 = ipt_palavra1.value;
    let palavra2 = ipt_palavra2.value;

    if (palavra1 === palavra2) {
      msg.innerHTML = `As palavras ${palavra1} e ${palavra2} são exatamente iguais!`;
    } else if (palavra1.toLowerCase() === palavra2.toLowerCase()) {
      msg.innerHTML = `As palavras ${palavra1} e ${palavra2} possuem o mesmo conteúdo, mas a digitação é diferente (maiúsculas e minúsculas)`;
    } else {
      msg.innerHTML = `As palavras ${palavra1} e ${palavra2} são completamente diferentes!`;
    }
  }
</script>
