<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Limite de Velocidade.</h1>
    Me informe a velocidade que estava dirigindo:
    <input type="number" id="ipt_velocidade" />
    Me informe o limite de velocidade da via:
    <input type="number" id="ipt_limite" />
    <button onclick="Verificar()">Verificar</button>
    <div id="mensagem"></div>
  </body>
</html>

<script>
  function Verificar() {
    let velocidadeDirigindo = Number(ipt_velocidade.value);
    let limiteVia = Number(ipt_limite.value);
    let percentual = (velocidadeDirigindo / limiteVia);

    if (velocidadeDirigindo <= limiteVia) {
      mensagem.innerHTML = `Velocidade dentro do limite. Boa direção!`;
    } else if (percentual <= 1.2) {
      mensagem.innerHTML = `Atenção! Excedendo o limite permitido.`;
    } else {
      mensagem.innerHTML = `Multa grave! Velocidade muito acima do permitido.`;
    }
  }
</script>
