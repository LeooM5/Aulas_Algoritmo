<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <button onclick="sortear()">Sortear momento do dia</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  function sortear() {
    let numRandom = (Math.random() * 23).toFixed();
    let mensagem = ``;

    if (numRandom <= 11) {
      mensagem = `Bom dia, flor do dia, são ${numRandom}h`;
    } else if (numRandom <= 17) {
      mensagem = `Boa tarde, já vai tarde! São ${numRandom}h`;
    } else {
      mensagem = `Boa noite, durma bem! São ${numRandom}h`;
    }

    msg.innerHTML = mensagem;
  }
</script>
