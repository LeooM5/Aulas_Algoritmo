<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <button onclick="gerarNota()">Gerar uma nota de aluno entre 3 e 10</button>
    <button onclick="gerarFreq()">
      Gerar uma frequência de aluno entre 50 e 100
    </button>
    <button onclick="exibir()">Ver Aprovação</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  let freq = "";
  let nota = "";

  function gerarNota() {
    let numRandom = (Math.random() * 7 + 3).toFixed(1);
    nota = numRandom;
    msg.innerHTML = numRandom;
  }

  function gerarFreq() {
    let numRandom = (Math.random() * 50 + 50).toFixed(1);

    freq = numRandom;
    msg.innerHTML = numRandom;
  }

  function exibir() {
    let situacao = ``;

    if (freq != "" && nota != "") {
      if (nota >= 6 && freq >= 75) {
        situacao = `aprovado`;
      } else {
        situacao = `reprovado`;
      }
      msg.innerHTML = `Com nota ${nota} e frequência ${freq}, o aluno está ${situacao}!`;
    } else {
      alert(`Deve gerar nota e frequência antes!`);
    }
  }
</script>
