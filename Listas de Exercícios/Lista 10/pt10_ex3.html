<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <button onclick="sortear()">jogar dado</button>
    <div
      style="
        width: 100px;
        height: 100px;
        background-color: black;
        color: white;
        text-align: center;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 2em;
      "
      id="msg"
    ></div>
  </body>
</html>

<script>
  function sortear() {
    let aleatorio = Math.random() * 20 + 1;
    let mensagem = ``;
    if (msg.style.display == "none") {
      msg.style.display = "flex";
    }
    mensagem = aleatorio.toFixed(0);

    msg.innerHTML = mensagem;
  }
</script>
