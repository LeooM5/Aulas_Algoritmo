<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <button onclick="gerarNota()">Gerar uma nota de aluno entre 0 e 10</button>
    <button onclick="gerarFreq()">
      Gerar uma frequência de aluno entre 0 e 100
    </button>
    <button onclick="exibir()">Ver Situação</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  let freq = "";
  let nota = "";

  function gerarNota() {
    let numRandom = (Math.random() * 10).toFixed(2);
    nota = numRandom;
    msg.innerHTML = numRandom;
  }

  function gerarFreq() {
    let numRandom = (Math.random() * 100).toFixed(2);

    freq = numRandom;
    msg.innerHTML = numRandom;
  }

  function exibir() {
    if (freq != "" && nota != "") {
      alert(`Nota: ${nota}, Frequência: ${freq}`);
    } else {
      alert(`Deve gerar nota e frequência!`);
    }
  }
</script>
