<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <fieldset>
      <legend>Informe seu nome</legend>
      <input type="text" id="ipt_nome" />
    </fieldset>
    <fieldset>
      <legend>Informe seu número da sorte</legend>
      <input type="number" id="ipt_num" />
    </fieldset>
    <button onclick="sortear()">Sortear</button>
    <div id="div_msg"></div>
  </body>
</html>

<script>
  let qtdSorteios = 0;
  let numsSorteio = [];
  function sortear() {
    let nome = ipt_nome.value;
    let num = Number(ipt_num.value);
    let msg = ``;

    if (numsSorteio.length == 3) {
      let numrandom = (Math.random() * 99 + 1).toFixed();
      qtdSorteios++;
      for (let i = 0; i < numsSorteio.length; i++) {
        if (numsSorteio[i] == numrandom) {
          msg = `Parabéns, ${nome} o seu número da sorte ${numrandom} foi sorteado após ${qtdSorteios} sorteios!`;
        }
      }
    } else if (num > 0 && num <= 100 && numsSorteio.length < 3) {
      numsSorteio.push(num);
    } else {
      alert("Você deve inserir 3 números para o sorteio! De 1 a 100!");
    }

    div_msg.innerHTML = msg;
  }
</script>
