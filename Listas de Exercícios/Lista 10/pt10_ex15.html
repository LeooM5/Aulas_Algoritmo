<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <p>Números pares: <span id="par">0</span></p>
    <p>Números ímpares: <span id="impar">0</span></p>
    <button onclick="sortear()">Sortear número</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  let qtdPar = 0;
  let qtdImpar = 0;
  function sortear() {
    let num = (Math.random() * 21 - 30).toFixed();

    if (num % 2 == 0) {
      qtdPar++;
    } else {
      qtdImpar++;
    }

    par.innerHTML = qtdPar;
    impar.innerHTML = qtdImpar;

    msg.innerHTML = `Número sorteado: ${num}`;
  }
</script>
