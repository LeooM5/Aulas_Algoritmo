<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Observador de Índices</h1>

    Me informe o número de qual letra deseja ver
    <input type="number" id="ipt_numero" />
    Me informe uma frase
    <input oninput="analisar()" type="text" id="ipt_frase" />

    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let palavra1 = String(ipt_frase.value);
    let numero = Number(ipt_numero.value);

    msg.innerHTML = `
    <br> A primeira letra é: ${palavra1[0]} <br>
    A ${numero}ª letra é: ${palavra1[numero - 1]} <br>
    A última letra é: ${palavra1[palavra1.length - 1]}
    `;
  }
</script>
