<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Substituidor de Caracteres</h1>

    Me informe uma senha
    <input oninput="analisar()" type="text" id="ipt_senha" />

    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let palavra1 = ipt_senha.value;

    let palavra2 = palavra1
      .replaceAll("a", "@")
      .replaceAll("A", "@")
      .replaceAll("e", "3")
      .replaceAll("E", "3");

    msg.innerHTML = `${palavra2}`;
  }
</script>
