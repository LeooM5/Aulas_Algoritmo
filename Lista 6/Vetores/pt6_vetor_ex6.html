<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <h1>Lista Viva de Filmes Favoritos</h1>

    <input type="text" id="ipt_filme" />
    <button onclick="cadastrar()">Cadastar</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  let filmes = [];
  let contador = 0;

  function cadastrar() {
    let filme = ipt_filme.value;
    filmes.push(filme);

    msg.innerHTML += `<br>${filmes[contador]}<br>`;

    contador++;
  }
</script>
