<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
  </head>

  <body>
    <h1>Relembrando Moradias: Onde Você Já Viveu?</h1>

    Nome do bairro que Viveu
    <input type="text" id="ipt_bairro" />
    Local onde morou
    <input type="number" id="ipt_local" />
    <button onclick="cadastrar()">Cadastrar bairro</button>
    <button onclick="relembrar()">Relembrar moradia</button>
    <div id="msg"></div>
  </body>
</html>

<script>
  let bairrosVividos = [];

  function cadastrar() {
    let bairro = ipt_bairro.value;

    bairrosVividos.push(bairro);
  }

  function relembrar() {
    let local = Number(ipt_local.value);

    if (local > bairrosVividos.length) {
      msg.innerHTML = `Você ainda não morou num ${local}º bairro!"`;
    } else {
      msg.innerHTML = `${local}° Bairro Cadastrado: ${bairrosVividos[local - 1]}`;
    }
  }
</script>
