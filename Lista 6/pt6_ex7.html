<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Senha Forte ou Fraca</h1>

    Me informe uma senha
    <input oninput="analisar()" type="text" id="ipt_senha" />

    <div id="msg"></div>
  </body>
</html>

<script>
  function analisar() {
    let criterios = 0;
    let mensagem = "";
    let senha = ipt_senha.value;
    let temMaius = senha != senha.toLowerCase();
    let temMinus = senha != senha.toUpperCase();

    if (senha.length >= 8) {
      criterios++;
    }

    if (temMaius == true) {
      criterios++;
    }

    if (temMinus == true) {
      criterios++;
    }

    if (criterios == 0) {
      mensagem = `A senha é Insegura`;
    } else if (criterios == 1) {
      mensagem = `A senha é Fraca`;
    } else if (criterios == 2) {
      mensagem = `A senha é Média`;
    } else {
      mensagem = `A senha é Forte`;
    }

    msg.innerHTML = mensagem;
  }
</script>
